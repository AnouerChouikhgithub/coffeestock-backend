name: backend-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: coffeestock_test
          POSTGRES_USER: coffeestock
          POSTGRES_PASSWORD: coffeestock
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U coffeestock -d coffeestock_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, mbstring, xml
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate Symfony configuration
        run: php bin/console lint:container

      - name: Run test suite
        run: php bin/phpunit

      - name: Run PHPStan
        run: php vendor/bin/phpstan analyse --memory-limit=1G

      - name: Check code style
        run: php vendor/bin/php-cs-fixer fix --dry-run --diff --using-cache=no
